<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bloom</title>
<meta name="theme-color" content="#FBF4F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bloom">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

</script>
<style>
:root{
  --bg:#FBF4F1; --card:#FFFFFF; --ink:#2E2226; --ink2:#5C4A50; --muted:#9A878C;
  --rose:#D45F82; --rose-deep:#B8456A; --blush:#F8DDE4; --petal:#F2C2CF; --line:#F0E2E5;
  --sage:#E1EBE2; --butter:#FBF0D3; --peach:#FADFCF; --sky:#E2EAF4;
  --m1:#C9B8E0; --m2:#B9CDE6; --m3:#F3DFA6; --m4:#F6BFCB; --m5:#E7799A;
  --shadow:0 1px 2px rgba(80,40,50,.04),0 8px 24px rgba(120,60,80,.07);
  --r:22px; --serif:"Fraunces",Georgia,"Times New Roman",serif; --sans:"Inter",-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}
body{min-height:100dvh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:var(--ink)}
.app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 96px)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.kicker{font-size:11px;letter-spacing:.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;text-transform:uppercase;color:var(--muted);font-weight:500}
.sos{flex:none;white-space:nowrap;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--rose-deep);background:var(--blush);padding:8px 13px;border-radius:999px}
.sos svg{width:16px;height:16px}
h1{font-family:var(--serif);font-weight:400;font-size:38px;line-height:1.05;letter-spacing:-.02em;margin:10px 0 6px}
h1 em{font-style:italic;color:var(--rose)}
h2{font-family:var(--serif);font-weight:400;font-size:24px;letter-spacing:-.01em;margin:0 0 4px}
h3{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:28px 0 10px}
.sub{color:var(--ink2);margin:0 0 18px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin-bottom:14px}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 22px;border-radius:999px;font-weight:600;font-size:16px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--rose);color:#fff;box-shadow:0 6px 18px rgba(212,95,130,.28)}
.btn-soft{background:var(--blush);color:var(--rose-deep)}
.btn-ghost{background:#F6EEF0;color:var(--ink2)}
.btn-block{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:999px;background:#F6EEF0;color:var(--ink2);font-size:14px;font-weight:500;margin:0 6px 8px 0;transition:all .15s}
.chip.on{background:var(--rose);color:#fff}
.chip:active{transform:scale(.96)}

/* Energie */
.energy{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.en{border-radius:18px;padding:16px 8px 14px;text-align:center;background:#F7F0F2;transition:all .2s}
.en .bars{display:flex;justify-content:center;gap:4px;height:26px;align-items:flex-end;margin-bottom:8px}
.en .bars i{display:block;width:7px;border-radius:4px;background:var(--petal)}
.en .bars i.f{background:var(--rose)}
.en b{display:block;font-weight:600;font-size:15px}
.en span{font-size:12px;color:var(--muted)}
.en.on{background:var(--blush);box-shadow:inset 0 0 0 2px var(--rose)}

/* Eine Sache */
.one{background:linear-gradient(160deg,#FFFFFF 0%,#FFF6F8 100%);padding:26px 22px 20px}
.one .cat{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--rose);font-weight:600}
.one .task{font-family:var(--serif);font-size:30px;line-height:1.12;letter-spacing:-.015em;margin:10px 0 6px}
.one .hint{color:var(--muted);font-size:14px;margin-bottom:20px}
.one .actions{display:flex;gap:8px;margin-top:12px}
.one .actions button{flex:1;height:44px;border-radius:999px;background:#F6EEF0;color:var(--ink2);font-size:14px;font-weight:500}
.progress{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.progress i{width:28px;height:28px;border-radius:50%;background:#F4EAED;display:flex;align-items:center;justify-content:center}
.progress i svg{width:28px;height:28px}

.lara-quote{background:var(--blush);border-radius:var(--r);padding:20px 22px;margin-bottom:14px}
.lara-quote p{font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.35;margin:0 0 8px;color:#4A2A35}
.lara-quote span{font-size:13px;color:var(--rose-deep);font-weight:500}

.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(251,244,241,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:8px 0 calc(env(safe-area-inset-bottom) + 8px);z-index:20}
.tabs .in{max-width:480px;margin:0 auto;display:flex;justify-content:space-around}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted);padding:4px 18px}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--rose-deep)}
.fab{position:fixed;right:max(18px,calc(50% - 222px));bottom:calc(env(safe-area-inset-bottom) + 84px);height:52px;padding:0 20px;border-radius:999px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;box-shadow:0 10px 26px rgba(46,34,38,.25);z-index:15}
.fab svg{width:18px;height:18px}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgba(46,34,38,.32);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 24px);max-height:92dvh;overflow-y:auto;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:41}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:#E6D6DA;margin:0 auto 14px}
.sheet-close{position:absolute;right:16px;top:14px;width:36px;height:36px;border-radius:50%;background:#F1E6E9;display:flex;align-items:center;justify-content:center}
.sheet-close svg{width:18px;height:18px}

/* Mood */
.moods{display:flex;justify-content:space-between;gap:6px}
.mood{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--ink2);padding:8px 0;border-radius:16px;transition:all .15s}
.mood i{width:40px;height:40px;border-radius:50%;display:block;transition:transform .15s}
.mood.on{background:#fff;box-shadow:var(--shadow)}
.mood.on i{transform:scale(1.12)}
textarea{width:100%;border:0;border-radius:16px;background:#fff;box-shadow:var(--shadow);padding:14px;font-size:16px;resize:none;min-height:90px;outline:none}
input[type=text],input[type=tel],input[type=number],input[type=url]{width:100%;height:50px;border:0;border-radius:14px;background:#fff;box-shadow:var(--shadow);padding:0 14px;font-size:16px;outline:none}
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:14px 0 6px}

/* Garten */
.garden{background:linear-gradient(180deg,#FFF7F4 0%,#FCEBEE 100%);border-radius:var(--r);padding:18px 14px 12px;box-shadow:var(--shadow);margin-bottom:14px}
.garden .bed{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;min-height:120px;align-items:end}
.garden .bed svg{width:100%;height:auto;animation:pop .5s both}
.garden .count{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.garden .count b{font-family:var(--serif);font-size:44px;font-weight:400;line-height:1;color:var(--rose-deep)}
@keyframes pop{from{transform:scale(.2) translateY(8px);opacity:0}to{transform:none;opacity:1}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:11px;color:var(--muted);font-weight:600;padding-bottom:4px}
.cal .d{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;color:var(--ink2);position:relative}
.cal .d.has{background:var(--blush);color:var(--rose-deep);font-weight:600}
.cal .d.today{box-shadow:inset 0 0 0 1.5px var(--rose)}
.cal .d .pd{display:flex;gap:2px;margin-top:2px}
.cal .d .pd i{width:4px;height:4px;border-radius:50%;background:var(--rose)}
.calnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.calnav button{width:36px;height:36px;border-radius:50%;background:#F6EEF0;display:flex;align-items:center;justify-content:center}
.calnav svg{width:16px;height:16px}
.insight{display:flex;gap:14px;align-items:flex-start}
.insight .ic{width:38px;height:38px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center}
.insight .ic svg{width:20px;height:20px}
.letter{background:#FFFDFB;border-radius:var(--r);box-shadow:var(--shadow);padding:24px 22px;margin-bottom:14px;border-top:4px solid var(--petal)}
.letter .kw{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--rose)}
.letter p{font-family:var(--serif);font-size:17px;line-height:1.5;margin:10px 0;color:#3A2A2F}

/* Rewards */
.rw{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.rw:last-child{border-bottom:0}
.rw .bar{height:6px;border-radius:3px;background:#F4E8EB;overflow:hidden;margin-top:6px}
.rw .bar i{display:block;height:100%;background:var(--rose);border-radius:3px}
.rw .badge{font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px}

/* Celebrate */
.celebrate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:60}
.celebrate .bloom{animation:bloomin 1.6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes bloomin{0%{transform:scale(.1) rotate(-30deg);opacity:0}25%{transform:scale(1.15) rotate(0);opacity:1}60%{transform:scale(1)}100%{transform:scale(.3) translateY(60vh);opacity:0}}
.petal{position:fixed;width:10px;height:14px;border-radius:50% 50% 50% 0;z-index:59;pointer-events:none;animation:fall 1.8s ease-out forwards}
@keyframes fall{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 16px);transform:translate(-50%,-260%);background:var(--ink);color:#fff;padding:14px 18px;border-radius:18px;max-width:min(420px,calc(100% - 32px));font-size:15px;line-height:1.35;box-shadow:0 12px 30px rgba(0,0,0,.18);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:70}
.toast.on{transform:translate(-50%,0)}

/* Atem */
.breath{width:200px;height:200px;margin:20px auto 10px;border-radius:50%;background:radial-gradient(circle,#F8C9D5 0%,#F8DDE4 60%,transparent 70%);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:22px;color:var(--rose-deep);transition:transform 4s ease-in-out}

/* Onboarding */
.ob{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:40px 4px}
.ob .big{font-family:var(--serif);font-size:44px;line-height:1.02;letter-spacing:-.02em;margin:16px 0}
.ob .big em{color:var(--rose);font-style:italic}
.steps{display:flex;gap:6px;margin-bottom:24px}
.steps i{height:4px;flex:1;border-radius:2px;background:#EBDCE0}
.steps i.on{background:var(--rose)}
.chat{display:flex;flex-direction:column;gap:10px;margin:10px 0 14px}
.msg{padding:12px 16px;border-radius:18px;max-width:86%;font-size:15px;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--rose);color:#fff;border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:#fff;box-shadow:var(--shadow);border-bottom-left-radius:6px}
.switch{width:52px;height:32px;border-radius:16px;background:#E9DCDF;position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:transform .2s}
.switch.on{background:var(--rose)} .switch.on::after{transform:translateX(20px)}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="root"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ================= Icons (Linien) ================= */
const I = (p,extra="") => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" ${extra}>${p}</svg>`;
const ic = {
  sun: I('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
  flower: I('<circle cx="12" cy="9" r="2.2"/><path d="M12 6.8c0-2.4 1.2-3.8 2.4-3.8S16.6 5 14.6 7.4M14.2 9c2.4 0 3.8 1.2 3.8 2.4s-2 2.2-4.4.2M12 11.2c0 2.4-1.2 3.8-2.4 3.8S7.4 13 9.4 10.6M9.8 9C7.4 9 6 7.8 6 6.6S8 4.4 10.4 6.4M12 13v8M12 18c-2 0-3.5-1-4-2.5M12 17c1.8 0 3.2-.9 3.7-2.2"/>'),
  user: I('<circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1.3-3.6 4.2-5.4 7.5-5.4s6.2 1.8 7.5 5.4"/>'),
  plus: I('<path d="M12 5v14M5 12h14"/>'),
  check: I('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
  x: I('<path d="M6 6l12 12M18 6L6 18"/>'),
  phone: I('<path d="M5 4h3.5l1.8 4.5-2.3 1.4a11 11 0 0 0 6.1 6.1l1.4-2.3L20 15.5V19a1.5 1.5 0 0 1-1.6 1.5C10.6 20 4 13.4 3.5 5.6A1.5 1.5 0 0 1 5 4z"/>'),
  msg: I('<path d="M4 5h16v11H9l-5 4z"/>'),
  wind: I('<path d="M3 8h10.5a2.5 2.5 0 1 0-2.5-2.5M3 12h15.5a2.5 2.5 0 1 1-2.5 2.5M3 16h7"/>'),
  leaf: I('<path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14z"/><path d="M5 19c3-4 6-6.5 9-8"/>'),
  down: I('<path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 20h14"/>'),
  up: I('<path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M5 20h14"/>'),
  spark: I('<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 1.8 1.8.7-1.8.7L19 21l-.7-1.8-1.8-.7 1.8-.7z"/>'),
  left: I('<path d="M15 5l-7 7 7 7"/>'),
  right: I('<path d="M9 5l7 7-7 7"/>'),
  small: I('<path d="M8 12h8"/><circle cx="12" cy="12" r="8"/>'),
  shuffle: I('<path d="M4 7h3c4 0 6 10 10 10h3M17 14l3 3-3 3M4 17h3c1.5 0 2.7-1.4 3.7-3M17 4l3 3-3 3M20 7h-3c-1.5 0-2.7 1.4-3.7 3"/>'),
  heart: I('<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>'),
  clock: I('<circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2"/>'),
  moon: I('<path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z"/>'),
  baby: I('<circle cx="12" cy="10" r="5"/><path d="M10 10h.01M14 10h.01M10.5 12.5c.9.6 2.1.6 3 0M12 5c0-1 .8-2 2-2M8 19.5c1.2-1.4 2.5-2 4-2s2.8.6 4 2"/>'),
  pen: I('<path d="M4 20l4-1L19 8l-3-3L5 16z"/>'),
  trash: I('<path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"/>'),
  gift: I('<rect x="4" y="9" width="16" height="11" rx="1.5"/><path d="M4 13h16M12 9v11M12 9c-1.5-3-5-3.5-5-1.5S10 9 12 9zM12 9c1.5-3 5-3.5 5-1.5S14 9 12 9z"/>'),
  chat: I('<path d="M5 18l-1 3 3.5-1.5A8.5 8.5 0 1 0 5 18z"/>'),
  eye: I('<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.6"/>'),
};

/* ================= Hilfsfunktionen ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const dkey = (d=new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y,m-1,d); };
const daysBetween = (a,b) => Math.round((parseKey(b) - parseKey(a)) / 864e5);
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const WD = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const MO = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const hourBlock = h => h < 5 ? "nachts" : h < 11 ? "morgens" : h < 14 ? "mittags" : h < 18 ? "nachmittags" : h < 22 ? "abends" : "nachts";

/* ================= Inhalte ================= */
const CATS = {
  start:{name:"Start in den Tag", col:"var(--butter)"},
  kueche:{name:"Küche", col:"var(--peach)"},
  waesche:{name:"Wäsche", col:"var(--sky)"},
  ordnung:{name:"Ordnung", col:"var(--sage)"},
  essen:{name:"Essen", col:"var(--peach)"},
  ich:{name:"Für dich", col:"var(--blush)"},
  papier:{name:"Papierkram", col:"var(--sky)"},
};
// level: 1 = geht auch an schweren Tagen, 3 = braucht Kraft. rhythm: ungefähr alle X Tage
const TASKS = [
  {id:"t_feet", cat:"start", text:"Füße auf den Boden stellen", mini:"Einmal im Bett richtig strecken", level:1, rhythm:1, morning:true},

/* ================= Lern-Engine (lokal) ================= */
function taskStats(id){
  const ev = S.events.filter(e => e.id === id);
  const done = ev.filter(e => e.a === "done"); const skip = ev.filter(e => e.a === "skip");
  const hours = done.map(e => e.h);
  const last = done.length ? done[done.length-1].d : null;
  return {done:done.length, skip:skip.length, hours, last, recentSkips: ev.slice(-4).filter(e=>e.a==="skip").length};
}
function shouldGoMini(t){
  const st = taskStats(t.id);
  return (st.skip >= 3 && st.skip > st.done) || st.recentSkips >= 2;
}
function scoreTask(t, energy, now=new Date()){
  const st = taskStats(t.id); const k = dkey(now);
  let s = 0;
  // Fälligkeit nach Rhythmus
  if(st.last){ const gap = daysBetween(st.last, k); s += Math.min(gap / t.rhythm, 3) * 2; }
  else s += 2.5;
  // Lieblingszeit: Wie oft wurde die Aufgabe in diesem Tagesabschnitt erledigt?
  const blk = hourBlock(now.getHours());
  if(st.hours.length){ const same = st.hours.filter(h => hourBlock(h) === blk).length; s += (same / st.hours.length) * 2; }
  // Erfolgsquote
  const tot = st.done + st.skip; if(tot) s += (st.done / tot) * 1.5;
  // Schwerpunkte aus dem Onboarding
  if(S.profile && S.profile.struggles.includes(t.cat)) s += 0.8;
  // Morgens: erst ankommen
  if(t.morning && now.getHours() < 12) s += 1.5;
  if(t.morning && now.getHours() >= 15) s -= 3;
  // Bei wenig Energie leichte Aufgaben bevorzugen
  if(energy === 1) s -= (t.level - 1) * 2;
  s += Math.random() * 0.6;
  return s;
}
function nextTask(excludeIds=[]){
  const d = today(); const energy = d.energy || 2;
  const doneToday = d.done.map(x => x.id); const skipped = d.skips;
  let pool = allTasks().filter(t => t.level <= Math.max(energy,1) + (energy===3?0:0) && !doneToday.includes(t.id) && !excludeIds.includes(t.id));
  // Rhythmus: nicht zu früh wieder (außer tägliche)
  pool = pool.filter(t => { const st = taskStats(t.id); return !st.last || t.rhythm <= 1 || daysBetween(st.last, dkey()) >= Math.max(1, Math.floor(t.rhythm*0.6)); });
  let fresh = pool.filter(t => !skipped.includes(t.id));
  if(!fresh.length) fresh = pool;
  if(!fresh.length) return null;
  fresh.sort((a,b) => scoreTask(b,energy) - scoreTask(a,energy));
  const t = fresh[0];
  return {id:t.id, mini: energy === 1 || shouldGoMini(t)};
}

/* ---------- Muster erkennen ---------- */
function insights(){
  const out = [];
  const ci = S.checkins;
  const doneEv = S.events.filter(e => e.a === "done");
  if(doneEv.length >= 6){
    const blocks = {}; doneEv.forEach(e => { const b = hourBlock(e.h); blocks[b] = (blocks[b]||0)+1; });
    const best = Object.entries(blocks).sort((a,b)=>b[1]-a[1])[0];
    out.push({icon:"clock", col:"var(--butter)", t:`Deine starke Zeit ist ${best[0]}`, b:`Da hast du bisher die meisten Sachen geschafft. Ich schlage dir dann gezielt etwas vor.`});
  }
  if(ci.length >= 5){
    const avg = arr => arr.reduce((a,b)=>a+b,0)/arr.length;
    const withTag = (tag) => ci.filter(c => c.tags.includes(tag)).map(c=>c.mood);
    const without = (tag) => ci.filter(c => !c.tags.includes(tag)).map(c=>c.mood);
    const checks = [
      ["draußen gewesen", "An Tagen, an denen du draußen warst, ging es dir spürbar besser. Frische Luft ist dein Cheatcode.", false, "Rausgehen tut dir gut"],
      ["gutes Gespräch", "Gute Gespräche heben deine Stimmung deutlich. Menschen tun dir gut.", false, "Reden hilft dir"],
      ["gut geschlafen", "Wenn du gut schläfst, ist deine Stimmung besser. Schlaf ist bei dir kein Luxus, sondern Medizin.", false, "Schlaf ist dein Superpower"],
      ["schlecht geschlafen", "Nach schlechten Nächten ist es schwerer. Plan dann lieber einen Mini-Tag ein, ganz ohne schlechtes Gewissen.", true, "Nach kurzen Nächten: Sparmodus"],
      ["allein gefühlt", `Wenn du dich allein fühlst, sinkt die Stimmung. Genau dann: ${S.settings.laraName} anrufen. Ernsthaft.`, true, "Allein ist schwerer"],
    ];
    for(const [tag, txt, neg, title] of checks){
      const a = withTag(tag), b = without(tag);
      if(a.length >= 2 && b.length >= 2){
        const diff = avg(a) - avg(b);
        if((!neg && diff >= 0.6) || (neg && diff <= -0.6)) out.push({icon: neg?"moon":"leaf", col: neg?"var(--sky)":"var(--sage)", t: title, b: txt});
      }
    }
    // Stimmung und Erledigtes
    const byDay = {}; ci.forEach(c => { const k = dkey(new Date(c.ts)); (byDay[k] = byDay[k]||[]).push(c.mood); });
    const pairs = Object.entries(byDay).map(([k,m]) => [avg(m), (S.days[k]?.done.length||0)]);
    const act = pairs.filter(p=>p[1]>=1).map(p=>p[0]), lazy = pairs.filter(p=>p[1]===0).map(p=>p[0]);
    if(act.length >= 2 && lazy.length >= 2 && avg(act) - avg(lazy) >= 0.5)
      out.push({icon:"spark", col:"var(--blush)", t:"Schon eine Kleinigkeit hilft", b:"An Tagen, an denen du nur eine Sache erledigt hast, war deine Stimmung höher als an Tagen ohne."});
  }
  // Was oft liegen bleibt
  const skipCount = {}; S.events.filter(e=>e.a==="skip").forEach(e => skipCount[e.id] = (skipCount[e.id]||0)+1);
  const hard = Object.entries(skipCount).filter(([id,n]) => n >= 3).sort((a,b)=>b[1]-a[1])[0];
  if(hard){ const t = taskById(hard[0]); if(t) out.push({icon:"small", col:"var(--peach)", t:`„${t.text}“ ist gerade zäh`, b:`Ich zeig dir dafür erstmal die Mini-Version: „${t.mini}“. Kleiner Einstieg, gleiche Blüte.`}); }
  // Wochentag
  const wdCount = {}; Object.entries(S.days).forEach(([k,d]) => { if(d.done.length){ const w = parseKey(k).getDay(); wdCount[w] = (wdCount[w]||0) + d.done.length; }});
  const wds = Object.entries(wdCount); if(wds.length >= 4){ const b = wds.sort((a,b)=>b[1]-a[1])[0]; out.push({icon:"sun", col:"var(--butter)", t:`${WD[b[0]]} ist dein Macher-Tag`, b:`An diesem Wochentag schaffst du am meisten. Größere Sachen passen da gut hin.`}); }
  return out;
}

/* ---------- Wochenbrief (lokal) ---------- */
function weekKey(d=new Date()){ const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day); const y0 = new Date(Date.UTC(t.getUTCFullYear(),0,1)); return `${t.getUTCFullYear()}-KW${Math.ceil(((t-y0)/864e5+1)/7)}`; }
function lastNDays(n){ const arr=[]; for(let i=n-1;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); arr.push(dkey(d)); } return arr; }
function weekStats(){
  const ks = lastNDays(7);
  const days = ks.map(k => ({k, d:S.days[k]})).filter(x => x.d);
  const done = days.reduce((a,x)=>a+x.d.done.length,0);
  const mama = days.reduce((a,x)=>a+x.d.mama.length,0);
  const blooms = days.reduce((a,x)=>a+x.d.blooms,0);
  const active = days.filter(x => x.d.done.length || x.d.mama.length).length;
  const best = days.slice().sort((a,b)=> (b.d.done.length+b.d.mama.length)-(a.d.done.length+a.d.mama.length))[0];
  const ci = S.checkins.filter(c => ks.includes(dkey(new Date(c.ts))));
  const moodAvg = ci.length ? ci.reduce((a,c)=>a+c.mood,0)/ci.length : null;
  const tagCount = {}; ci.forEach(c=>c.tags.forEach(t=>tagCount[t]=(tagCount[t]||0)+1));
  const topTag = Object.entries(tagCount).sort((a,b)=>b[1]-a[1])[0];
  return {done, mama, blooms, active, best, moodAvg, topTag, ci};
}

      : w.moodAvg >= 2.5 ? "Deine Stimmung war gemischt. Ein bisschen Auf und Ab gehört dazu, bei allen Menschen."
      : "Es war eine schwere Woche für dich. Danke, dass du trotzdem reingeschaut hast. Das ist mutiger, als es sich anfühlt.");

  return p;
}

function flowerSVG(seed, size=40){
  const pal = ["#F2A7BC","#E7799A","#F6C3A7","#F3DFA6","#F7B6C8","#E994AE","#F9CDD8","#F0A389","#D45F82"];
  const r = (n) => { const x = Math.sin(seed*9301+n*49297)*233280; return x - Math.floor(x); };
  const col = pal[Math.floor(r(1)*pal.length)]; const petals = 5 + Math.floor(r(2)*3);
  const stem = 14 + r(3)*10; const rot = r(4)*60;
  let p = "";
  for(let i=0;i<petals;i++){ const a = rot + i*360/petals; p += `<ellipse cx="20" cy="${12}" rx="5.4" ry="8.5" fill="${col}" opacity=".92" transform="rotate(${a} 20 20)"/>`; }
  return `<svg viewBox="0 0 40 ${40+stem}" width="${size}" style="--d:${(seed%10)*40}ms" aria-hidden="true">
    <path d="M20 26 C ${20 + (r(5)-.5)*8} ${30+stem/2}, 20 ${34+stem/2}, 20 ${40+stem}" stroke="#A9C3A8" stroke-width="2" fill="none"/>
    <ellipse cx="${r(6)>.5?25:15}" cy="${30+stem/2}" rx="4.5" ry="2.2" fill="#BFD4BE" transform="rotate(${r(6)>.5?-30:30} 20 ${30+stem/2})"/>
    ${p}<circle cx="20" cy="20" r="4.2" fill="#F8E1A0"/><circle cx="20" cy="20" r="1.6" fill="#E8B865"/></svg>`;
}

  }

  document.querySelectorAll("[data-mama]").forEach(b => b.onclick = () => {

    sh.querySelectorAll("[data-cen]").forEach(b => b.onclick = () => { st.energy = +b.dataset.cen; sh.querySelectorAll("[data-cen]").forEach(x=>x.classList.toggle("on", x===b)); });

    <div class="card" id="ground"></div>
    <p class="small muted" style="text-align:center;margin-top:20px">Wenn du in akuter Gefahr bist: 112</p>
  `, sh => {
    const steps = ["5 Dinge, die du sehen kannst.","4 Dinge, die du anfassen kannst. Fühl sie wirklich.","3 Dinge, die du hören kannst.","2 Dinge, die du riechen kannst.","1 Sache, die du schmecken kannst. Oder ein Schluck Wasser.","Gut gemacht. Du bist hier. Du bist sicher in diesem Moment."];
    let gi = 0; const g = sh.querySelector("#ground");
    const drawG = () => { g.innerHTML = `<p style="font-family:var(--serif);font-size:20px;margin:0 0 14px">${steps[gi]}</p>${gi<steps.length-1?`<button class="btn btn-ghost" id="gNext">Weiter</button>`:`<button class="btn btn-ghost" id="gNext">Nochmal</button>`}`; g.querySelector("#gNext").onclick = () => { gi = (gi+1) % steps.length; drawG(); }; };
    drawG();
    const b = sh.querySelector("#breath");
    sh.querySelector("#breathBtn").onclick = (e) => {
      clearInterval(breathTimer); let phase = 0; e.currentTarget.textContent = "Läuft …";
      const tick = () => { if(phase%2===0){ b.textContent="Einatmen"; b.style.transitionDuration="4s"; b.style.transform="scale(1.25)"; } else { b.textContent="Ausatmen"; b.style.transitionDuration="6s"; b.style.transform="scale(.85)"; } phase++; };
      tick(); let elapsed = 0;
      breathTimer = setInterval(() => { elapsed += 1; const need = (phase%2===1) ? 4 : 6; if(elapsed >= need){ elapsed = 0; tick(); } }, 1000);
    };
  });
}

    ${S.rewards.map(r=>{ const pct = Math.min(100, Math.round(total/r.need*100)); const open = total >= r.need;
      return `<div class="rw"><span style="color:var(--rose);flex:none">${ic.gift.replace('<svg','<svg width="24" height="24"')}</span>
      <div style="flex:1;min-width:0"><div style="font-weight:500">${esc(r.title)}</div><div class="small muted">${r.redeemed?"Gegönnt am "+fmtShort(dkey(new Date(r.redeemed))):open?"Freigeschaltet!":`${total} von ${r.need} Blüten`}</div>${!r.redeemed?`<div class="bar"><i style="width:${pct}%"></i></div>`:""}</div>
      ${r.redeemed?`<span class="badge" style="background:var(--sage);color:#4D6B52">Gegönnt</span>`:open?`<button class="badge" style="background:var(--rose);color:#fff" data-redeem="${r.id}">Gönnen</button>`:`<button aria-label="Löschen" data-delrw="${r.id}" style="color:var(--muted)">${ic.trash.replace('<svg','<svg width="18" height="18"')}</button>`}</div>`; }).join("")}
    <button class="btn btn-ghost btn-block" id="addReward" style="margin:12px 0 10px;height:46px">${ic.plus} Eigene Belohnung</button></div>
    <p class="small muted" style="margin:-4px 4px 0">Blüten werden beim Gönnen nicht abgezogen. Was du gesammelt hast, bleibt.</p>`;

  html += `<h3>Kleine Helfer</h3><div class="card" style="padding:6px 20px">
    <button class="list-item" style="width:100%;text-align:left" data-sos><span style="color:var(--rose)">${ic.wind}</span><span style="flex:1">Atmen & zur Ruhe kommen</span>${ic.right.replace('<svg','<svg width="16" height="16" style="color:var(--muted)"')}</button>
    <button class="list-item" style="width:100%;text-align:left" id="myTasks"><span style="color:var(--rose)">${ic.pen}</span><span style="flex:1">Aufgaben anpassen</span>${ic.right.replace('<svg','<svg width="16" height="16" style="color:var(--muted)"')}</button>
    ${st.aiOn && st.aiUrl ? `<button class="list-item" style="width:100%;text-align:left" id="aiChat"><span style="color:var(--rose)">${ic.chat}</span><span style="flex:1">Mit Bloom reden</span>${ic.right.replace('<svg','<svg width="16" height="16" style="color:var(--muted)"')}</button>`:""}
  </div>`;

  const lb = st.lastBackup ? fmtShort(dkey(new Date(st.lastBackup))) : "noch nie";
  html += `<h3>Sicherung</h3><div class="card">
    <p class="small muted" style="margin:0 0 12px">Alles ist nur auf diesem Handy gespeichert. Mach ab und zu ein Backup, zum Beispiel in iCloud Drive. Letztes Backup: <b>${lb}</b></p>
    <div class="row"><button class="btn btn-soft" style="flex:1" id="exportBtn">${ic.down} Backup</button><button class="btn btn-ghost" style="flex:1" id="importBtn">${ic.up} Laden</button></div>
    <input type="file" id="importFile" accept="application/json,.json" class="hidden"></div>`;

  html += `<h3>KI-Begleiterin</h3><div class="card">
    <div class="row" style="align-items:flex-start"><div style="flex:1"><b style="font-weight:600">Wochenbrief & Chat mit KI</b>
    <p class="small muted" style="margin:4px 0 0">Wenn an, werden deine Einträge der letzten 2 Wochen zum Schreiben an eine KI geschickt. Wenn aus, bleibt alles auf dem Handy. Die eingebaute Auswertung lernt so oder so.</p></div>
    <button class="switch ${st.aiOn?"on":""}" id="aiToggle" aria-label="KI an oder aus"></button></div>
    ${st.aiOn?`<label class="f">Adresse des KI-Dienstes</label><input type="url" id="aiUrl" value="${esc(st.aiUrl)}" placeholder="https://bloom-ki.….workers.dev">`:""}</div>`;

  html += `<h3>Einstellungen</h3><div class="card">
    <label class="f" style="margin-top:0">Dein Name</label><input type="text" id="setName" value="${esc(S.profile.name)}">
    <label class="f">Name deiner Tochter</label><input type="text" id="setKid" value="${esc(S.profile.kid||"")}">
    <label class="f">Telefonnummer von ${esc(st.laraName)}</label><input type="tel" id="setPhone" value="${esc(st.laraPhone)}" placeholder="+49 …">
    <button class="btn btn-ghost btn-block" id="saveSettings" style="margin-top:16px">Speichern</button></div>
    <p class="small muted" style="text-align:center;margin:24px 0 10px">Bloom · gemacht mit Liebe von ${esc(st.laraName)}</p>`;
  return html;
}
function bindMe(){
  $("#readLetter").onclick = openLoveLetter;
  document.querySelectorAll("[data-redeem]").forEach(b => b.onclick = () => { const r = S.rewards.find(x=>x.id===b.dataset.redeem); r.redeemed = Date.now(); save(); render(); celebrate("Gönn dir! Du hast es dir verdient. Ohne Diskussion."); });
  document.querySelectorAll("[data-delrw]").forEach(b => b.onclick = () => { if(confirm("Belohnung löschen?")){ S.rewards = S.rewards.filter(x=>x.id!==b.dataset.delrw); save(); render(); } });
  $("#addReward").onclick = () => openSheet(`<h2>Eigene Belohnung</h2><label class="f">Was gönnst du dir?</label><input type="text" id="rwT" placeholder="z. B. Neues Lipgloss">
    <label class="f">Ab wie vielen Blüten?</label><input type="number" id="rwN" value="${Math.max(10, Math.ceil((S.totalBlooms+20)/5)*5)}" inputmode="numeric">
    <button class="btn btn-primary btn-block" id="rwS" style="margin-top:18px">Hinzufügen</button>`, sh => {
      sh.querySelector("#rwS").onclick = () => { const t = sh.querySelector("#rwT").value.trim(); const n = parseInt(sh.querySelector("#rwN").value,10); if(!t || !(n>0)) return toast("Bitte Titel und Zahl eintragen."); S.rewards.push({id:"r"+Date.now(), title:t, need:n, redeemed:null}); S.rewards.sort((a,b)=>a.need-b.need); save(); closeSheet(); render(); };
    });
  $("#myTasks").onclick = openTaskEditor;
  const ac = $("#aiChat"); if(ac) ac.onclick = openAiChat;
  $("#exportBtn").onclick = exportBackup;
  $("#importBtn").onclick = () => $("#importFile").click();
  $("#importFile").onchange = importBackup;
  $("#aiToggle").onclick = () => {
    if(!S.settings.aiOn && !confirm("Wenn du das anschaltest, werden deine Check-ins, Notizen und erledigten Aufgaben der letzten 2 Wochen an einen KI-Dienst geschickt, damit er dir schreiben kann. Willst du das?")) return;
    S.settings.aiOn = !S.settings.aiOn; save(); render();
  };
  const au = $("#aiUrl"); if(au) au.onchange = () => { S.settings.aiUrl = au.value.trim(); save(); toast("Gespeichert."); };
  $("#saveSettings").onclick = () => { S.profile.name = $("#setName").value.trim() || S.profile.name; S.profile.kid = $("#setKid").value.trim(); S.settings.laraPhone = $("#setPhone").value.trim(); save(); render(); toast("Gespeichert."); };
}
function openTaskEditor(){
  const draw = () => `<h2>Aufgaben anpassen</h2><p class="small muted" style="margin:4px 0 14px">Tipp auf eine Aufgabe, um sie aus- oder einzublenden. Ausgeblendete schlage ich nicht mehr vor.</p>
    ${Object.entries(CATS).map(([k,c]) => { const ts = TASKS.concat(S.custom).filter(t=>t.cat===k); if(!ts.length) return ""; return `<h3 style="margin-top:16px">${c.name}</h3><div>${ts.map(t=>`<button class="chip ${S.hidden.includes(t.id)?"":"on"}" data-tog="${t.id}">${esc(t.text)}</button>`).join("")}</div>`; }).join("")}
    <h3>Eigene Aufgabe</h3><input type="text" id="ntT" placeholder="z. B. Pflanzen gießen">
    <label class="f">Mini-Version (optional)</label><input type="text" id="ntM" placeholder="z. B. Nur eine Pflanze">
    <label class="f">Wie oft ungefähr?</label><div>${[[1,"Täglich"],[3,"Alle paar Tage"],[7,"Wöchentlich"],[14,"Alle 2 Wochen"]].map(([v,w],i)=>`<button class="chip ${i===1?"on":""}" data-rh="${v}">${w}</button>`).join("")}</div>
    <label class="f">Wie anstrengend?</label><div>${[[1,"Leicht"],[2,"Mittel"],[3,"Braucht Kraft"]].map(([v,w],i)=>`<button class="chip ${i===0?"on":""}" data-lv="${v}">${w}</button>`).join("")}</div>
    <button class="btn btn-primary btn-block" id="ntS" style="margin-top:16px">${ic.plus} Hinzufügen</button>`;
  const mount = sh => {
    let rh = 3, lv = 1;
    sh.querySelectorAll("[data-tog]").forEach(b => b.onclick = () => { const id = b.dataset.tog; const i = S.hidden.indexOf(id); i>=0 ? S.hidden.splice(i,1) : S.hidden.push(id); b.classList.toggle("on"); S.current = null; save(); });
    sh.querySelectorAll("[data-rh]").forEach(b => b.onclick = () => { rh = +b.dataset.rh; sh.querySelectorAll("[data-rh]").forEach(x=>x.classList.toggle("on",x===b)); });
    sh.querySelectorAll("[data-lv]").forEach(b => b.onclick = () => { lv = +b.dataset.lv; sh.querySelectorAll("[data-lv]").forEach(x=>x.classList.toggle("on",x===b)); });
    sh.querySelector("#ntS").onclick = () => {
      const t = sh.querySelector("#ntT").value.trim(); if(!t) return toast("Wie heißt die Aufgabe?");
      S.custom.push({id:"c"+Date.now(), cat:"ordnung", text:t, mini:sh.querySelector("#ntM").value.trim() || null, level:lv, rhythm:rh});
      save(); toast("Aufgabe hinzugefügt."); openSheet(draw(), mount);
    };
  };
  openSheet(draw(), mount);
}

/* ================= Backup ================= */
function exportBackup(){
  try{
    S.settings.lastBackup = Date.now(); save();
    const blob = new Blob([JSON.stringify(S, null, 1)], {type:"application/json"});
    const file = new File([blob], `bloom-backup-${dkey()}.json`, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){ navigator.share({files:[file], title:"Bloom Backup"}).catch(()=>{}); }
    else { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = file.name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 1000); }
    render(); toast("Backup erstellt. Speicher die Datei am besten in iCloud Drive.");
  } catch(e){ toast("Backup hat nicht geklappt: " + e.message); }
}
function importBackup(ev){
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const data = JSON.parse(r.result);
      if(!data || data.v !== 1 || !data.days) throw new Error("Das ist keine Bloom-Sicherung.");
      if(!confirm("Backup laden? Die aktuellen Daten auf diesem Handy werden ersetzt.")) return;
      S = Object.assign(freshState(), data); save(); render(); toast("Backup geladen. Willkommen zurück im Garten.");
    } catch(e){ toast("Konnte nicht geladen werden: " + e.message); }
  };
  r.readAsText(f);
}

/* ================= KI (optional, über eigenen Worker) ================= */
function aiContext(){
  const ks = lastNDays(14);
  const days = ks.filter(k=>S.days[k]).map(k => ({datum:k, wochentag:WD[parseKey(k).getDay()], energie:S.days[k].energy, erledigt:S.days[k].done.map(x=>x.text+" ("+pad(new Date(x.ts).getHours())+" Uhr)"), mama:S.days[k].mama.map(x=>x.label)}));
  const ci = S.checkins.filter(c => ks.includes(dkey(new Date(c.ts)))).map(c => ({zeit:new Date(c.ts).toLocaleString("de-DE"), stimmung:MOODS[c.mood-1].w, energie:["","wenig","mittel","gut"][c.energy||0], tags:c.tags, notiz:c.note}));
  return {name:S.profile.name, tochter:S.profile.kid||null, schwer_faellt:S.profile.struggles.map(k=>CATS[k]?.name), schwester:S.settings.laraName, bisherige_blueten:S.totalBlooms, tage:days, checkins:ci, erkannte_muster:insights().map(i=>i.b)};
}
async function callAI(mode, messages){
  const res = await fetch(S.settings.aiUrl, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({mode, context:aiContext(), messages})});
  if(!res.ok) throw new Error("Der KI-Dienst antwortet gerade nicht (" + res.status + ").");
  const j = await res.json(); if(!j.text) throw new Error("Leere Antwort."); return j.text;
}
async function aiWriteLetter(e){
  const b = e.currentTarget; b.disabled = true; b.textContent = "Schreibt gerade …";
  try{ const t = await callAI("letter", []); S.letters[weekKey()] = t; save(); render(); toast("Dein neuer Wochenbrief ist da."); }
  catch(err){ toast(err.message); b.disabled=false; b.textContent="Nochmal versuchen"; }
}
function openAiChat(){
  const draw = () => `<h2>Mit Bloom reden</h2><p class="small muted" style="margin:4px 0 6px">Bloom kennt deine letzten 2 Wochen. Bloom ist keine Therapeutin, aber eine gute Zuhörerin.</p>
    <div class="chat" id="chatBox">${S.chat.length ? S.chat.slice(-20).map(m=>`<div class="msg ${m.role==="user"?"me":"ai"}">${esc(m.content)}</div>`).join("") : `<div class="msg ai">Hey ${esc(S.profile.name)}. Was ist los? Du kannst mir alles schreiben, auch „Ich schaff heute gar nichts“.</div>`}</div>
    <textarea id="chatIn" style="min-height:60px" placeholder="Schreib was …"></textarea>
    <div class="row" style="margin-top:10px"><button class="btn btn-primary" style="flex:1" id="chatSend">Senden</button><button class="btn btn-ghost" id="chatClear">Leeren</button></div>`;
  const mount = sh => {
    const box = sh.querySelector("#chatBox"); box.lastElementChild && box.lastElementChild.scrollIntoView();
    sh.querySelector("#chatClear").onclick = () => { S.chat = []; save(); openSheet(draw(), mount); };
    sh.querySelector("#chatSend").onclick = async (e) => {
      const inp = sh.querySelector("#chatIn"); const t = inp.value.trim(); if(!t) return;
      S.chat.push({role:"user", content:t}); save(); inp.value = "";
      box.insertAdjacentHTML("beforeend", `<div class="msg me">${esc(t)}</div><div class="msg ai" id="typing">…</div>`); box.lastElementChild.scrollIntoView();
      e.currentTarget.disabled = true;
      try{ const ans = await callAI("chat", S.chat.slice(-12)); S.chat.push({role:"assistant", content:ans}); save(); $("#typing").outerHTML = `<div class="msg ai">${esc(ans)}</div>`; }
      catch(err){ $("#typing").outerHTML = `<div class="msg ai">${esc(err.message)}</div>`; S.chat.pop(); save(); }
      e.currentTarget.disabled = false;
      if(DISTRESS.test(t)) setTimeout(()=>openHelp(true), 1200);
    };
  };
  openSheet(draw(), mount);
}

/* ================= Onboarding ================= */
function renderOnboarding(step, data={name:"", kid:"", struggles:[]}){
  const steps = `<div class="steps">${[0,1,2,3].map(i=>`<i class="${i<=step?"on":""}"></i>`).join("")}</div>`;
  let html = "";
  if(step===0) html = `<div class="kicker">Ein Geschenk für dich</div><div class="big">Willkommen in <em>Bloom</em>.</div>
    <p class="sub">Eine App, die dich nicht stresst. Hier sammelst du nur. Du verlierst nie etwas, und jede kleine Sache lässt eine Blüte wachsen.</p>
    <button class="btn btn-primary btn-block" id="obNext">Los geht's</button>`;
  if(step===1) html = `<div class="big" style="font-size:36px">Wie heißt du?</div><input type="text" id="obName" value="${esc(data.name)}" placeholder="Dein Name" autocomplete="given-name">
    <label class="f" style="margin-top:22px">Und deine Tochter?</label><input type="text" id="obKid" value="${esc(data.kid)}" placeholder="Name (optional)">
    <button class="btn btn-primary btn-block" id="obNext" style="margin-top:24px">Weiter</button>`;
  if(step===2) html = `<div class="big" style="font-size:36px">Was fällt dir im Alltag am schwersten?</div><p class="sub">Tipp alles an, was passt. Ich achte dann besonders darauf, es dir leicht zu machen.</p>
    <div>${STRUGGLES.map(s=>`<button class="chip ${data.struggles.includes(s.k)?"on":""}" data-st="${s.k}">${s.label}</button>`).join("")}</div>
    <button class="btn btn-primary btn-block" id="obNext" style="margin-top:24px">Weiter</button>`;
  if(step===3) html = `<div class="big" style="font-size:36px">So funktioniert's. <em>Ganz kurz.</em></div>
    <div class="card"><div class="insight"><div class="ic" style="background:var(--blush)">${ic.sun}</div><div><b style="font-weight:600">Heute</b><div class="small muted">Sag, wie viel Kraft du hast. Ich zeig dir immer nur eine kleine Sache.</div></div></div></div>
    <div class="card"><div class="insight"><div class="ic" style="background:var(--sage)">${ic.flower}</div><div><b style="font-weight:600">Garten</b><div class="small muted">Jede Sache wird eine Blüte. Die bleibt für immer, auch nach Pausen.</div></div></div></div>
    <div class="card"><div class="insight"><div class="ic" style="background:var(--butter)">${ic.pen}</div><div><b style="font-weight:600">Check-in</b><div class="small muted">Kurz sagen, wie's dir geht. So lerne ich, was dir guttut.</div></div></div></div>
    <button class="btn btn-primary btn-block" id="obNext" style="margin-top:10px">Fertig, zeig mir meinen Tag</button>`;
  $("#root").innerHTML = `<div class="app"><div class="ob">${step?steps:""}${html}</div></div>`;
  document.querySelectorAll("[data-st]").forEach(b => b.onclick = () => { const k=b.dataset.st; const i=data.struggles.indexOf(k); i>=0?data.struggles.splice(i,1):data.struggles.push(k); b.classList.toggle("on"); });
  $("#obNext").onclick = () => {
    if(step===1){ data.name = $("#obName").value.trim(); data.kid = $("#obKid").value.trim(); if(!data.name){ toast("Wie darf ich dich nennen?"); return; } }
    if(step < 3) return renderOnboarding(step+1, data);
    S.profile = {name:data.name, kid:data.kid, struggles:data.struggles, createdAt:Date.now()}; S.firstDay = dkey(); S.lastOpen = dkey(); save(); TAB="heute"; render();
  };
}

/* ================= Start ================= */
function onOpen(){
  if(!S.profile) return;
  const k = dkey();
  if(S.lastOpen && S.lastOpen !== k){
    const gap = daysBetween(S.lastOpen, k);
    if(gap >= 3){ S.comeback = true; addBloom(3); }
  }
  S.lastOpen = k;
  // Sanfte Backup-Erinnerung einmal pro Woche
  const lb = S.settings.lastBackup, ln = S.settings.lastBackupNudge;
  if((!lb || Date.now()-lb > 7*864e5) && (!ln || Date.now()-ln > 7*864e5) && Object.keys(S.days).length >= 3){
    S.settings.lastBackupNudge = Date.now(); setTimeout(()=>toast("Kleine Erinnerung: Mach mal wieder ein Backup unter „Ich“. Dein Garten soll sicher sein.", 5000), 1500);
  }
  save();
}
load(); onOpen(); render();
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
document.addEventListener("visibilitychange", () => { if(document.visibilityState==="visible" && S.profile && S.lastOpen !== dkey()){ S.current = null; onOpen(); render(); } });
</script>
</body>
</html>
